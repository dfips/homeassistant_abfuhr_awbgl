[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "RET",
  "PTH",
  "ASYNC",
  "BLE",
  "D",
  "RUF",
]
ignore = [
  "D203",
  "D213",
  "D406",
  "D407",
  "E501",
  "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true
